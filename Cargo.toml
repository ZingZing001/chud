[package]
name = "chud"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
serde_json = "1.0.151"
tui-term = "0.3.4"
vt100 = "0.16.2"

[workspace]
members = ["app"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
